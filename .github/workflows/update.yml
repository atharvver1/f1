name: Update after each race

on:
  schedule:
    - cron: "0 6 * * 2"      # every Tuesday 06:00 UTC, after F1DB has the weekend's results
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download data and rebuild the results table
        run: |
          python src/00_get_data.py
          python src/01_build_dataset.py data/f1db/src/data

      - name: Is there a new race?
        id: check
        run: |
          if git diff --quiet -- data/processed/results.csv; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild features, predictions and charts
        if: steps.check.outputs.new == 'true'
        run: python run_all.py --skip-download

      - name: Commit the new results
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed outputs
          git commit -m "Update data and forecasts after the latest race"
          git push
